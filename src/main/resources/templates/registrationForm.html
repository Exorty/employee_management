<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/styleLoginAndRegistration.css}">

    <title>Registro</title>
    <link rel="icon" type="image/ico" href="/images/favicon.ico" />
</head>

<body class="registration_body">




<section class="Form my-4 mx-5">
    <div class="container">
        <div class="row no-gutters my-5">
            <div class="col-lg-5">
                <img src="/images/image-registration.jpg" class="img-fluid" alt="">
            </div>

            <div class="col-lg-7 px-5 pt-5" style="background-color: white;">
                <h1 class="font-weight-bold pt-3">Registre a sua conta</h1>
               
                <form method="post" th:action="@{/registration}" th:object="${appUser}">

                    <div class="row">
                        <div class="col-lg-7">
                            <input class="form-control mt-4 p-4" type="text" name="username" th:value="*{username}" autocomplete="username" placeholder="Usuário">
                         <div  class="alert alert-danger mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                    </div>



                    <div class="row">
                        <div class="col-lg-7">
                            <input class="form-control mt-4 p-4" type="password" name="password" th:value="*{password}" autocomplete="new-password" placeholder="*********">
                            <div  class="alert alert-danger mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-lg-7">
                            <button class="btn1 mt-3 mb-5" type="submit">Registrar</button>
                        </div>
                    </div>
                       
                    
                
                    <p>Já possui uma conta? acesse <a href="/login">aqui</a></p>
              
                </form>

            </div>
        </div>
    </div>
</section>









    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
