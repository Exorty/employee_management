<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/styleLoginAndRegistration.css}">

    <title>Login</title>
    <link rel="icon" type="image/ico" href="/images/favicon.ico" />
</head>

<body class="login_body">




<section class="Form my-4 mx-5">
    <div class="container">
        <div class="row no-gutters my-5">
            <div class="col-lg-5">
                <img src="images/image-login.jpg" class="img-fluid" alt="">
            </div>

            <div class="col-lg-7 px-5 pt-5" style="background-color: white;">
                <h1 class="font-weight-bold pt-3">Gerenciador de funcionários</h1>
                <h3 class="font-weight-bold pt-4">Entre na sua conta</h3>
                <form th:action="@{/login}" method="POST"  th:object="${appUser}">
                    <div class="row">

                        <div class="col-lg-7">
                            <input class="form-control mt-4 p-4" type="text" id="username" name="username" autocomplete="username" placeholder="Usuário">

                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-7">
                            <input class="form-control mt-4 p-4" type="password" id="password" name="password" autocomplete="current-password" placeholder="*********">

                        </div>
                    </div>


                    <div class="row">
                        <div class="col-lg-7">
                            <button class="btn1 mt-3 mb-5" type="submit">Login</button>
                        </div>
                    </div>
                       
              
                    <p>Não possui uma conta? se registre <a href="/registration">aqui</a></p>
              
                </form>

            </div>
        </div>
    </div>
</section>









    <!-- Optional JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
